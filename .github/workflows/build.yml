
name: Build GROLICH Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build GROLICH Launcher V0.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Check Project Files
        run: |
          echo "Repository contents:"
          ls -la
          echo "Searching for Gradle Wrapper..."
          find . -name gradlew -type f

      - name: Grant Gradle Permission
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "./gradle/gradlew" ]; then
            chmod +x ./gradle/gradlew
          else
            echo "ERROR: Gradle Wrapper tidak ditemukan!"
            echo "Pastikan gradlew tersedia di repository."
            exit 1
          fi

      - name: Build GROLICH APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload GROLICH APK
        uses: actions/upload-artifact@v4
        with:
          name: GROLICH-Launcher-V0.1
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
