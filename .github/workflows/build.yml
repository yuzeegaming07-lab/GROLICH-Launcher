
name: Build GROLICH Launcher V0.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check Project Structure
        run: |
          echo "Checking GROLICH project..."
          ls -la
          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts
          test -d app

      - name: Check Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew tidak ditemukan!"
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: gradle-wrapper.jar tidak ditemukan!"
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties tidak ditemukan!"
            exit 1
          fi

      - name: Grant Gradle Permission
        run: chmod +x ./gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build GROLICH Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload GROLICH APK
        uses: actions/upload-artifact@v4
        with:
          name: GROLICH-Launcher-V0.1
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
